<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>To Do List</title>
</head>
<body>
    <header></header>
    <main>
        <div id="To_Do_list">
            <h1>To Do List</h1>
            <input id="input" placeholder="Введите задачу">
            <button id="add_task">Add</button>
        </div>
        <div id="Tasks_List">
            <h2>Task List</h2>
            <div id="only-tasks">

            </div>
        </div>
        <div id="counter">
            <p>
                Completed: <span id="completed">0</span>
            </p>
            <p>
                Completed: <span id="uncompleted">0</span>
            </p>
        </div>
    </main>
       <script src="script.js"></script>
</body>
</html>
